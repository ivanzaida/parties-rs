[package]
name = "music-bot"
version = "0.1.1"
edition = "2024"

[lib]
name = "music_bot"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
opus = "0.3.1"
minimp3 = "0.6.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server-plugin = { path = "../server-plugin" }
symphonia = { version = "0.6.0", default-features = false, features = ["aac", "isomp4", "opt-simd"] }
