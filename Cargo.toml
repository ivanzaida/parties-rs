[package]
name = "parties-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
lurq = { version = "0.1.1", features = ["dx12", "resources", "winit", "image", "wgpu", "devtools"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["sync"] }
