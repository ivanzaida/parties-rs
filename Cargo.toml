[package]
name = "parties-rs"
version = "0.1.1"
edition = "2024"

[features]
default = []
native-video = []

[dependencies]
bip39 = "2.2.2"
bytes = "1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
cpal = "0.18.0"
ed25519-dalek = "2.2.0"
getrandom = "0.4.2"
lurq = { version = "0.10.8", features = ["resources", "winit", "image", "wgpu", "dx12", "devtools", "i18n", "serde", "clipboard", "tokio", "router", "form", "svg"] }
log = "0.4"
minimp3 = "0.6.1"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
opus = "0.3.1"
quinn = "0.11"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.0"
simplelog = "0.12"
sonora = "0.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time"] }
rdev = "0.5.3"
xcap = "0.9.6"


[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
core-media-sys = "0.1.2"
core-video-sys = "0.1.4"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant"] }
windows-core = "0.62.2"

[target.'cfg(windows)'.build-dependencies]
cc = "1.2"
