name: Build music bot plugin

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/music-bot/**
      - crates/server-plugin/**
      - .github/workflows/build-music-bot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-metadata:
    name: Read plugin metadata
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          package_file="crates/music-bot/Cargo.toml"
          read_toml_string() {
            sed -nE "s/^$1 = \"(.*)\"$/\1/p" "$package_file" | head -n1
          }

          package_name="$(read_toml_string name)"
          package_version="$(read_toml_string version)"

          if [[ -z "$package_name" || -z "$package_version" ]]; then
            echo "Failed to read package metadata from $package_file" >&2
            exit 1
          fi

          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: plugin-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            artifact_suffix: linux-x64
            library_file: libmusic_bot.so
            library_path: target/release/libmusic_bot.so
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      PLUGIN_ID: parties.music_bot
      PLUGIN_VERSION: ${{ needs.plugin-metadata.outputs.version }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
      LIBRARY_FILE: ${{ matrix.library_file }}
      LIBRARY_PATH: ${{ matrix.library_path }}
      ARCHIVE_EXT: ${{ matrix.archive_ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-music-bot-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-music-bot-release-

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev

      - name: Build release plugin
        run: cargo build --release --package music-bot --lib

      - name: Stage plugin artifact
        shell: pwsh
        run: |
          $artifact = "$env:PLUGIN_ID-$env:PLUGIN_VERSION-$env:ARTIFACT_SUFFIX"
          $dist = Join-Path "dist" $artifact
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item $env:LIBRARY_PATH (Join-Path $dist $env:LIBRARY_FILE)

          $template = Get-Content "crates/music-bot/plugin.template.toml"
          $manifestLines = foreach ($line in $template) {
            $line
            if ($line -match '^name = ') {
              "version = `"$env:PLUGIN_VERSION`""
            }
          }
          $manifest = ($manifestLines -join "`n") + "`n"
          $manifest = $manifest -replace 'library = ".*"', "library = `"$env:LIBRARY_FILE`""
          Set-Content -Path (Join-Path $dist "plugin.toml") -Value $manifest -NoNewline

      - name: Package Linux plugin
        shell: bash
        run: |
          set -euo pipefail
          artifact="$PLUGIN_ID-$PLUGIN_VERSION-$ARTIFACT_SUFFIX"
          tar -czf "dist/$artifact.$ARCHIVE_EXT" -C "dist/$artifact" .

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-${{ env.PLUGIN_VERSION }}-${{ env.ARTIFACT_SUFFIX }}
          path: dist/${{ env.PLUGIN_ID }}-${{ env.PLUGIN_VERSION }}-${{ env.ARTIFACT_SUFFIX }}.${{ env.ARCHIVE_EXT }}
          if-no-files-found: error

  release:
    name: Publish plugin release
    needs:
      - plugin-metadata
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_NAME: ${{ needs.plugin-metadata.outputs.name }}
      PACKAGE_VERSION: ${{ needs.plugin-metadata.outputs.version }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create or update plugin release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          tag="$PACKAGE_NAME-v$PACKAGE_VERSION"
          title="$PACKAGE_NAME $PACKAGE_VERSION"
          notes_file="$RUNNER_TEMP/release-notes.md"
          previous_tag="$(git tag --list "$PACKAGE_NAME-v*" --sort=-v:refname | grep -v "^$tag$" | head -n1 || true)"

          {
            echo "Automated plugin build for $PACKAGE_NAME $PACKAGE_VERSION."
            echo
            echo "## Changelog"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since \`$previous_tag\`:"
              changelog="$(git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA")"
            else
              echo "Initial release history:"
              changelog="$(git log --max-count=50 --format='- %s (%h)' "$GITHUB_SHA")"
            fi

            if [[ -n "$changelog" ]]; then
              printf '%s\n' "$changelog"
            else
              echo "- No commits found."
            fi
          } > "$notes_file"

          files=()
          for asset in dist-artifacts/**/*; do
            if [[ -f "$asset" ]]; then
              files+=("$asset")
            fi
          done

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No plugin release assets found." >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GH_REPO" \
              --title "$title" \
              --notes-file "$notes_file"
            gh release upload "$tag" "${files[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file"
          fi
