name: Build client binaries

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-metadata:
    name: Read package metadata
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package name and version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          read -r current_name current_version < <(python3 - <<'PY'
          import tomllib
          with open("crates/client/Cargo.toml", "rb") as f:
              package = tomllib.load(f)["package"]
          print(package["name"], package["version"])
          PY
          )

          previous_name=""
          previous_version=""
          before="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "push" && "$before" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$before:crates/client/Cargo.toml" 2>/dev/null; then
            git show "$before:crates/client/Cargo.toml" > "$RUNNER_TEMP/Cargo.previous.toml"
            read -r previous_name previous_version < <(python3 - "$RUNNER_TEMP/Cargo.previous.toml" <<'PY'
          import sys
          import tomllib
          with open(sys.argv[1], "rb") as f:
              package = tomllib.load(f)["package"]
          print(package["name"], package["version"])
          PY
            )
          fi

          changed=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$current_name" != "$previous_name" || "$current_version" != "$previous_version" ]]; then
            changed=true
          fi

          if [[ "$changed" != true && "${{ github.event_name }}" == "push" ]]; then
            tag="v$current_version"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              changed=true
            fi
          fi

          {
            echo "name=$current_name"
            echo "version=$current_version"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: package-metadata
    if: needs.package-metadata.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact_suffix: windows-x64
            rust_target: x86_64-pc-windows-msvc
            binary_name: parties-rs.exe
            archive_ext: zip
          - label: macOS arm64
            os: macos-15
            artifact_suffix: macos-arm64
            rust_target: aarch64-apple-darwin
            binary_name: parties-rs
            archive_ext: dmg
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_NAME: ${{ needs.package-metadata.outputs.name }}
      PACKAGE_VERSION: ${{ needs.package-metadata.outputs.version }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
      RUST_TARGET: ${{ matrix.rust_target }}
      BINARY_NAME: ${{ matrix.binary_name }}
      BINARY_PATH: target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}
      ARCHIVE_EXT: ${{ matrix.archive_ext }}
      MACOS_APP_NAME: parties-rs
      MACOS_ICON_FILE: parties_icon.icns
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      SPARKLE_VERSION: "2.9.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo dependencies and release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.rust_target }}/release
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-release-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/client/build.rs', 'crates/client/src/native/windows_video/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust_target }}-cargo-release-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.rust_target }}-cargo-release-

      - name: Build release client
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ runner.os == 'Windows' && '2' || '0' }}
        run: cargo build --release --target ${{ matrix.rust_target }} --package ${{ env.PACKAGE_NAME }}

      - name: Download Sparkle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          sparkle_archive="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          sparkle_extract="$RUNNER_TEMP/sparkle"
          mkdir -p "$sparkle_extract"
          curl -L \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            -o "$sparkle_archive"
          tar -xJf "$sparkle_archive" -C "$sparkle_extract"

          sparkle_framework="$(find "$sparkle_extract" -maxdepth 3 -type d -name Sparkle.framework -print -quit)"
          if [[ -z "$sparkle_framework" ]]; then
            echo "::error::Sparkle.framework not found in Sparkle $SPARKLE_VERSION archive."
            find "$sparkle_extract" -maxdepth 3 -print
            exit 1
          fi
          sparkle_root="$(dirname "$sparkle_framework")"

          echo "SPARKLE_ROOT=$sparkle_root" >> "$GITHUB_ENV"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "$env:PACKAGE_NAME-$env:PACKAGE_VERSION-$env:ARTIFACT_SUFFIX"
          $dist = Join-Path "dist" $artifact
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item $env:BINARY_PATH $dist
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\$artifact.$env:ARCHIVE_EXT" -Force

      - name: Package Windows debug symbols
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "$env:PACKAGE_NAME-$env:PACKAGE_VERSION-$env:ARTIFACT_SUFFIX"
          $symbols = Join-Path "dist" "$artifact-debug-symbols"
          $releaseDir = Split-Path -Parent $env:BINARY_PATH
          $pdbs = @(Get-ChildItem -Path $releaseDir -Filter "*.pdb" -File)

          if ($pdbs.Count -eq 0) {
            Write-Error "No PDB files found in $releaseDir. Ensure release debug info is enabled."
            exit 1
          }

          New-Item -ItemType Directory -Force $symbols | Out-Null
          Copy-Item $env:BINARY_PATH $symbols
          foreach ($pdb in $pdbs) {
            Copy-Item $pdb.FullName $symbols
          }
          Compress-Archive -Path "$symbols\*" -DestinationPath "dist\$artifact-debug-symbols.zip" -Force

      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PUBLIC_KEY}" ]]; then
            echo "::error::Missing SPARKLE_PUBLIC_KEY secret."
            exit 1
          fi

          artifact="$PACKAGE_NAME-$PACKAGE_VERSION-$ARTIFACT_SUFFIX"
          dist="dist/$artifact"
          app="$dist/$MACOS_APP_NAME.app"

          rm -rf "$dist"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources"
          cp "$BINARY_PATH" "$app/Contents/MacOS/$BINARY_NAME"
          chmod +x "$app/Contents/MacOS/$BINARY_NAME"
          cp -R "$SPARKLE_ROOT/Sparkle.framework" "$app/Contents/Frameworks/"
          cp "crates/client/assets/icons/$MACOS_ICON_FILE" "$app/Contents/Resources/$MACOS_ICON_FILE"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>${MACOS_APP_NAME}</string>
            <key>CFBundleExecutable</key>
            <string>${BINARY_NAME}</string>
            <key>CFBundleIconFile</key>
            <string>${MACOS_ICON_FILE}</string>
            <key>CFBundleIdentifier</key>
            <string>dev.lurq.parties-rs</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${MACOS_APP_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${PACKAGE_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${PACKAGE_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>SUAllowsAutomaticUpdates</key>
            <true/>
            <key>SUEnableAutomaticChecks</key>
            <true/>
            <key>SUFeedURL</key>
            <string>https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml</string>
            <key>SUPublicEDKey</key>
            <string>${SPARKLE_PUBLIC_KEY}</string>
            <key>NSCameraUsageDescription</key>
            <string>${MACOS_APP_NAME} needs camera access to stream your webcam.</string>
            <key>NSMicrophoneUsageDescription</key>
            <string>${MACOS_APP_NAME} needs microphone access for voice chat and stream audio.</string>
            <key>NSScreenCaptureDescription</key>
            <string>${MACOS_APP_NAME} needs screen recording access to share your screen or application windows.</string>
          </dict>
          </plist>
          PLIST

      - name: Import macOS code signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${P12_BASE64}" || -z "${P12_PASSWORD}" ]]; then
            echo "::error::Missing MACOS_CERTIFICATE_P12 or MACOS_CERTIFICATE_PASSWORD secret."
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"

          P12_BASE64="$P12_BASE64" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "certificate.p12").write_bytes(base64.b64decode(os.environ["P12_BASE64"]))
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Code sign macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact="$PACKAGE_NAME-$PACKAGE_VERSION-$ARTIFACT_SUFFIX"
          app="dist/$artifact/$MACOS_APP_NAME.app"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')"

          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity found in imported keychain."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "Signing with: $identity"
          sparkle="$app/Contents/Frameworks/Sparkle.framework"
          sparkle_current="$(readlink "$sparkle/Versions/Current" || true)"
          sparkle_current="${sparkle_current:-B}"
          sparkle_version_dir="$sparkle/Versions/$sparkle_current"

          if [[ -d "$sparkle_version_dir/XPCServices" ]]; then
            find "$sparkle_version_dir/XPCServices" -name "*.xpc" -type d -print0 | while IFS= read -r -d '' xpc; do
              codesign --force --options runtime --timestamp --sign "$identity" "$xpc"
            done
          fi
          if [[ -d "$sparkle_version_dir/Updater.app" ]]; then
            codesign --force --options runtime --timestamp --sign "$identity" "$sparkle_version_dir/Updater.app"
          fi
          if [[ -f "$sparkle_version_dir/Autoupdate" ]]; then
            codesign --force --options runtime --timestamp --sign "$identity" "$sparkle_version_dir/Autoupdate"
          fi
          codesign --force --options runtime --timestamp --sign "$identity" "$sparkle_version_dir"
          codesign --force --options runtime --timestamp --sign "$identity" "$sparkle"

          codesign --force --options runtime --timestamp --sign "$identity" "$app/Contents/MacOS/$BINARY_NAME"
          codesign --force --options runtime --timestamp --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact="$PACKAGE_NAME-$PACKAGE_VERSION-$ARTIFACT_SUFFIX"
          dmg_path="dist/$artifact.$ARCHIVE_EXT"
          dmg_root="$RUNNER_TEMP/dmg-root"

          rm -rf "$dmg_root" "$dmg_path"
          mkdir -p "$dmg_root"
          cp -R "dist/$artifact/$MACOS_APP_NAME.app" "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"

          hdiutil create \
            -volname "$MACOS_APP_NAME" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$dmg_path"

      - name: Code sign macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact="$PACKAGE_NAME-$PACKAGE_VERSION-$ARTIFACT_SUFFIX"
          dmg_path="dist/$artifact.$ARCHIVE_EXT"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')"

          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity found in imported keychain."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          codesign --force --timestamp --sign "$identity" "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"

      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_ID}" || -z "${APP_PASSWORD}" || -z "${TEAM_ID}" ]]; then
            echo "::error::Missing MACOS_APPLE_ID, MACOS_APP_PASSWORD, or MACOS_TEAM_ID secret."
            exit 1
          fi

          artifact="$PACKAGE_NAME-$PACKAGE_VERSION-$ARTIFACT_SUFFIX"
          dmg_path="dist/$artifact.$ARCHIVE_EXT"

          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg_path"

      - name: Generate Sparkle appcast
        if: runner.os == 'macOS'
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY}" ]]; then
            echo "::error::Missing SPARKLE_ED_PRIVATE_KEY secret."
            exit 1
          fi

          artifact="$PACKAGE_NAME-$PACKAGE_VERSION-$ARTIFACT_SUFFIX"
          dmg_path="dist/$artifact.$ARCHIVE_EXT"
          dmg_size="$(stat -f%z "$dmg_path")"
          dmg_url="https://github.com/${{ github.repository }}/releases/download/v${PACKAGE_VERSION}/${artifact}.${ARCHIVE_EXT}"
          sign_tool="$SPARKLE_ROOT/bin/sign_update"

          if [[ ! -x "$sign_tool" ]]; then
            echo "::error::Sparkle sign_update not found at $sign_tool"
            exit 1
          fi

          signature="$("$sign_tool" -p "$dmg_path" --ed-key-file <(printf '%s' "$SPARKLE_ED_PRIVATE_KEY"))"
          case "$signature" in
            "" | *\"* | *" "* | *sparkle:*)
              echo "::error::Sparkle sign_update returned an invalid bare EdDSA signature: $signature"
              exit 1
              ;;
          esac

          cat > dist/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>${MACOS_APP_NAME} Updates</title>
              <item>
                <title>Version ${PACKAGE_VERSION}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${PACKAGE_VERSION}</sparkle:version>
                <sparkle:shortVersionString>${PACKAGE_VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="${dmg_url}"
                  length="${dmg_size}"
                  type="application/octet-stream"
                  sparkle:edSignature="${signature}" />
              </item>
            </channel>
          </rss>
          APPCAST

          xmllint --noout dist/appcast.xml

      - name: Clean up macOS signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-${{ env.ARTIFACT_SUFFIX }}
          path: dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-${{ env.ARTIFACT_SUFFIX }}.${{ env.ARCHIVE_EXT }}
          if-no-files-found: error

      - name: Upload Windows debug symbols artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-${{ env.ARTIFACT_SUFFIX }}-debug-symbols
          path: dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-${{ env.ARTIFACT_SUFFIX }}-debug-symbols.zip
          if-no-files-found: error

      - name: Upload Sparkle appcast artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-appcast
          path: dist/appcast.xml
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - package-metadata
      - build
    if: needs.package-metadata.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_NAME: ${{ needs.package-metadata.outputs.name }}
      PACKAGE_VERSION: ${{ needs.package-metadata.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          tag="v$PACKAGE_VERSION"
          title="$PACKAGE_NAME $PACKAGE_VERSION"
          notes="Automated client build for $PACKAGE_NAME $PACKAGE_VERSION."
          files=()
          for asset in dist-artifacts/**/*; do
            if [[ -f "$asset" ]]; then
              case "$asset" in
                *-debug-symbols.zip) continue ;;
              esac
              files+=("$asset")
            fi
          done

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
