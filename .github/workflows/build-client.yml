name: Build client binaries

on:
  push:
    paths:
      - Cargo.toml
      - .github/workflows/build-client.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-metadata:
    name: Read package metadata
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package name and version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          read -r current_name current_version < <(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["package"]
          print(package["name"], package["version"])
          PY
          )

          previous_name=""
          previous_version=""
          before="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "push" && "$before" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$before:Cargo.toml" 2>/dev/null; then
            git show "$before:Cargo.toml" > "$RUNNER_TEMP/Cargo.previous.toml"
            read -r previous_name previous_version < <(python3 - "$RUNNER_TEMP/Cargo.previous.toml" <<'PY'
          import sys
          import tomllib
          with open(sys.argv[1], "rb") as f:
              package = tomllib.load(f)["package"]
          print(package["name"], package["version"])
          PY
            )
          fi

          changed=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$current_name" != "$previous_name" || "$current_version" != "$previous_version" ]]; then
            changed=true
          fi

          {
            echo "name=$current_name"
            echo "version=$current_version"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: package-metadata
    if: needs.package-metadata.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact_suffix: windows-x64
            rust_target: x86_64-pc-windows-msvc
            binary_name: parties-rs.exe
            archive_ext: zip
          - label: macOS arm64
            os: macos-15
            artifact_suffix: macos-arm64
            rust_target: aarch64-apple-darwin
            binary_name: parties-rs
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_NAME: ${{ needs.package-metadata.outputs.name }}
      PACKAGE_VERSION: ${{ needs.package-metadata.outputs.version }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
      RUST_TARGET: ${{ matrix.rust_target }}
      BINARY_NAME: ${{ matrix.binary_name }}
      BINARY_PATH: target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}
      ARCHIVE_EXT: ${{ matrix.archive_ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release client
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "$env:PACKAGE_NAME-$env:PACKAGE_VERSION-$env:ARTIFACT_SUFFIX"
          $dist = Join-Path "dist" $artifact
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item $env:BINARY_PATH $dist
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\$artifact.$env:ARCHIVE_EXT" -Force

      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$PACKAGE_NAME-$PACKAGE_VERSION-$ARTIFACT_SUFFIX"
          dist="dist/$artifact"
          mkdir -p "$dist"
          cp "$BINARY_PATH" "$dist/"
          chmod +x "$dist/$BINARY_NAME"
          tar -czf "dist/$artifact.$ARCHIVE_EXT" -C dist "$artifact"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-${{ env.ARTIFACT_SUFFIX }}
          path: dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}-${{ env.ARTIFACT_SUFFIX }}.${{ env.ARCHIVE_EXT }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - package-metadata
      - build
    if: needs.package-metadata.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_NAME: ${{ needs.package-metadata.outputs.name }}
      PACKAGE_VERSION: ${{ needs.package-metadata.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          tag="v$PACKAGE_VERSION"
          title="$PACKAGE_NAME $PACKAGE_VERSION"
          notes="Automated client build for $PACKAGE_NAME $PACKAGE_VERSION."
          files=()
          for asset in dist-artifacts/**/*; do
            if [[ -f "$asset" ]]; then
              files+=("$asset")
            fi
          done

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
